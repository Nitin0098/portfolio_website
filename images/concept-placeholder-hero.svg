<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="conceptBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1329" />
      <stop offset="50%" stop-color="#101e40" />
      <stop offset="100%" stop-color="#070c1a" />
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <radialGradient id="cRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0a1329" stop-opacity="0" />
    </radialGradient>
  </defs>
  
  <rect width="1200" height="675" fill="url(#conceptBg)" />
  <circle cx="600" cy="337" r="300" fill="url(#cRadial)" />
  
  <!-- Conceptual Network / Minimal Constellation Nodes -->
  <g stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5">
    <line x1="600" y1="180" x2="420" y2="280" />
    <line x1="600" y1="180" x2="780" y2="280" />
    <line x1="420" y1="280" x2="480" y2="440" />
    <line x1="780" y1="280" x2="720" y2="440" />
    <line x1="480" y1="440" x2="720" y2="440" />
    
    <line x1="600" y1="180" x2="600" y2="350" />
    <line x1="420" y1="280" x2="600" y2="350" />
    <line x1="780" y1="280" x2="600" y2="350" />
    <line x1="480" y1="440" x2="600" y2="350" />
    <line x1="720" y1="440" x2="600" y2="350" />
  </g>
  
  <!-- Glowing Rings at nodes -->
  <circle cx="600" cy="180" r="18" fill="#0f1f3d" stroke="#38bdf8" stroke-width="2" />
  <circle cx="600" cy="180" r="6" fill="#38bdf8" />
  
  <circle cx="420" cy="280" r="16" fill="#0f1f3d" stroke="#a855f7" stroke-width="2" />
  <circle cx="420" cy="280" r="5" fill="#a855f7" />
  
  <circle cx="780" cy="280" r="16" fill="#0f1f3d" stroke="#a855f7" stroke-width="2" />
  <circle cx="780" cy="280" r="5" fill="#a855f7" />
  
  <circle cx="480" cy="440" r="14" fill="#0f1f3d" stroke="#38bdf8" stroke-width="2" />
  <circle cx="480" cy="440" r="4" fill="#38bdf8" />
  
  <circle cx="720" cy="440" r="14" fill="#0f1f3d" stroke="#38bdf8" stroke-width="2" />
  <circle cx="720" cy="440" r="4" fill="#38bdf8" />
  
  <!-- Central Concept Core -->
  <circle cx="600" cy="350" r="28" fill="#0b1733" stroke="url(#purpleGlow)" stroke-width="3" />
  <circle cx="600" cy="350" r="10" fill="#ffffff" />
  <circle cx="600" cy="350" r="45" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="6 6" />
  
  <text x="600" y="580" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" letter-spacing="4" font-weight="500">CONCEPT 01 // COGNITIVE ARCHITECTURE</text>
</svg>
