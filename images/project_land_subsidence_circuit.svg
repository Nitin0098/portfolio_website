<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <rect x="0" y="0" width="1500" height="920" fill="#ffffff"/>

  <!-- Title -->
  <text x="750" y="42" font-size="25" font-weight="700" fill="#111111" text-anchor="middle">Geosense — ESP32 Solar-Powered LoRa + IMU Node — Circuit Block Diagram</text>
  <line x1="80" y1="60" x2="1420" y2="60" stroke="#cccccc" stroke-width="1"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333333"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2e7d32"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#c0392b"/>
    </marker>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#9c7a1a"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6a2fb0"/>
    </marker>
  </defs>

  <!-- ================= ROW 1 : SOLAR / TP4056 / BOOST ================= -->

  <!-- Solar Panel -->
  <rect x="80" y="100" width="200" height="110" rx="10" fill="#fff7d6" stroke="#c9a53b" stroke-width="1.5"/>
  <text x="180" y="132" font-size="16" font-weight="700" text-anchor="middle" fill="#5a4718">Mini Solar Panel</text>
  <text x="180" y="152" font-size="12.5" text-anchor="middle" fill="#5a4718">5V Output</text>
  <g stroke="#c9a53b" stroke-width="1">
    <rect x="120" y="163" width="120" height="30" fill="#fff2b8"/>
    <line x1="150" y1="163" x2="150" y2="193"/>
    <line x1="180" y1="163" x2="180" y2="193"/>
    <line x1="210" y1="163" x2="210" y2="193"/>
    <line x1="120" y1="178" x2="240" y2="178"/>
  </g>

  <!-- TP4056 -->
  <rect x="340" y="90" width="220" height="150" rx="10" fill="#e8f0fe" stroke="#3b6fc9" stroke-width="1.5"/>
  <text x="450" y="120" font-size="16" font-weight="700" text-anchor="middle" fill="#1c3c78">TP4056 Module</text>
  <text x="450" y="140" font-size="12.5" text-anchor="middle" fill="#1c3c78">Charge + Over-discharge</text>
  <text x="450" y="156" font-size="12.5" text-anchor="middle" fill="#1c3c78">Protection (DW01+FS8205)</text>
  <text x="358" y="182" font-size="12" fill="#1c3c78">IN+/IN− ← Solar (5V)</text>
  <text x="358" y="200" font-size="12" fill="#1c3c78">BAT+/BAT− ↔ Battery</text>
  <text x="358" y="218" font-size="12" fill="#1c3c78">OUT+/OUT− → Boost Conv.</text>

  <!-- Boost Converter -->
  <rect x="620" y="90" width="220" height="130" rx="10" fill="#eaf7ea" stroke="#3a9142" stroke-width="1.5"/>
  <text x="730" y="120" font-size="16" font-weight="700" text-anchor="middle" fill="#1e5b24">Boost Converter</text>
  <text x="730" y="140" font-size="12.5" text-anchor="middle" fill="#1e5b24">3.0–4.2V → Stable 5V</text>
  <text x="638" y="166" font-size="12" fill="#1e5b24">IN+/IN− ← TP4056 OUT</text>
  <text x="638" y="184" font-size="12" fill="#1e5b24">OUT+ (5V) / OUT− (GND)</text>
  <text x="638" y="202" font-size="12" fill="#1e5b24">→ ESP32 (VIN, 5V)</text>

  <!-- ================= ROW 2 : BATTERY / ESP32 ================= -->

  <!-- Battery -->
  <rect x="340" y="300" width="220" height="100" rx="10" fill="#fdeaea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="450" y="335" font-size="16" font-weight="700" text-anchor="middle" fill="#7a1f1f">Li-ion Battery</text>
  <text x="450" y="357" font-size="13" text-anchor="middle" fill="#7a1f1f">3.7 V Single Cell</text>
  <text x="450" y="376" font-size="11.5" text-anchor="middle" fill="#7a1f1f">(BAT+ / BAT−)</text>

  <!-- ESP32 -->
  <rect x="620" y="300" width="240" height="250" rx="10" fill="#f3eafd" stroke="#7d3ac9" stroke-width="2"/>
  <text x="740" y="332" font-size="18" font-weight="700" text-anchor="middle" fill="#4a1f7a">ESP32 DevKit</text>
  <text x="740" y="352" font-size="12.5" text-anchor="middle" fill="#4a1f7a">Main Microcontroller</text>
  <line x1="636" y1="365" x2="844" y2="365" stroke="#c9b3ea"/>
  <text x="636" y="386" font-size="12" fill="#4a1f7a">VIN — 5V (from Boost)</text>
  <text x="636" y="404" font-size="12" fill="#4a1f7a">GND — Common Ground</text>
  <text x="636" y="422" font-size="12" fill="#4a1f7a">3.3V — Powers LoRa &amp; MPU6050</text>
  <line x1="636" y1="436" x2="844" y2="436" stroke="#c9b3ea"/>
  <text x="636" y="457" font-size="12" fill="#4a1f7a">SPI → LoRa</text>
  <text x="636" y="475" font-size="12" fill="#4a1f7a">(MOSI/MISO/SCK/NSS,</text>
  <text x="636" y="491" font-size="12" fill="#4a1f7a">RST, DIO0)</text>
  <text x="636" y="513" font-size="12" fill="#4a1f7a">I2C → MPU6050</text>
  <text x="636" y="531" font-size="12" fill="#4a1f7a">(SDA / SCL)</text>

  <!-- ================= RIGHT COLUMN : LoRa / MPU6050 ================= -->

  <!-- LoRa Module -->
  <rect x="1020" y="260" width="220" height="140" rx="10" fill="#e8f0fe" stroke="#3b6fc9" stroke-width="1.5"/>
  <text x="1130" y="292" font-size="16" font-weight="700" text-anchor="middle" fill="#1c3c78">LoRa Module</text>
  <text x="1130" y="312" font-size="12.5" text-anchor="middle" fill="#1c3c78">(e.g. SX1278 / RFM95)</text>
  <text x="1038" y="336" font-size="12" fill="#1c3c78">VCC ← 3.3V (ESP32)</text>
  <text x="1038" y="354" font-size="12" fill="#1c3c78">GND ← Common Ground</text>
  <text x="1038" y="372" font-size="12" fill="#1c3c78">SPI + RST/DIO0 ↔ ESP32</text>

  <!-- MPU6050 -->
  <rect x="1020" y="460" width="220" height="130" rx="10" fill="#fdf0e3" stroke="#c9822f" stroke-width="1.5"/>
  <text x="1130" y="492" font-size="16" font-weight="700" text-anchor="middle" fill="#7a4a12">MPU6050 IMU</text>
  <text x="1130" y="512" font-size="12.5" text-anchor="middle" fill="#7a4a12">Accelerometer + Gyro</text>
  <text x="1038" y="536" font-size="12" fill="#7a4a12">VCC ← 3.3V (ESP32, left)</text>
  <text x="1038" y="554" font-size="12" fill="#7a4a12">GND ← Common Ground</text>
  <text x="1038" y="572" font-size="12" fill="#7a4a12">I2C ↔ ESP32 (left)</text>

  <!-- ================= WIRES ================= -->

  <!-- Solar -> TP4056 -->
  <line x1="280" y1="155" x2="340" y2="155" stroke="#c9a53b" stroke-width="2.2" marker-end="url(#arrowGold)"/>
  <text x="284" y="147" font-size="11" fill="#5a4718">5V</text>

  <!-- TP4056 <-> Battery -->
  <path d="M 380 240 L 380 300" fill="none" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrowRed)"/>
  <path d="M 520 300 L 520 240" fill="none" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrowRed)"/>
  <text x="386" y="270" font-size="11" fill="#7a1f1f">BAT+</text>
  <text x="486" y="270" font-size="11" fill="#7a1f1f">BAT−</text>

  <!-- TP4056 -> Boost -->
  <line x1="560" y1="150" x2="620" y2="150" stroke="#3a9142" stroke-width="2.2" marker-end="url(#arrowGreen)"/>
  <text x="566" y="142" font-size="11" fill="#1e5b24">3.7V</text>

  <!-- Boost -> ESP32 VIN (5V) -->
  <path d="M 730 220 L 730 300" fill="none" stroke="#3a9142" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="738" y="265" font-size="12" fill="#1e5b24" font-weight="600">5V</text>

  <!-- ESP32 -> LoRa : 3.3V -->
  <line x1="860" y1="422" x2="1020" y2="336" stroke="#7d3ac9" stroke-width="2.2" marker-end="url(#arrowPurple)"/>
  <text x="880" y="380" font-size="11" fill="#4a1f7a">3.3V</text>

  <!-- ESP32 -> LoRa : SPI -->
  <line x1="860" y1="465" x2="1020" y2="365" stroke="#333333" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="900" y="440" font-size="11" fill="#333333">SPI</text>

  <!-- ESP32 -> MPU6050 : 3.3V -->
  <line x1="860" y1="490" x2="1020" y2="475" stroke="#7d3ac9" stroke-width="2.2" marker-end="url(#arrowPurple)"/>
  <text x="880" y="483" font-size="11" fill="#4a1f7a">3.3V</text>

  <!-- ESP32 -> MPU6050 : I2C -->
  <line x1="860" y1="513" x2="1020" y2="513" stroke="#333333" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="905" y="506" font-size="11" fill="#333333">I2C</text>

  <!-- Ground is referenced via GND labels inside each block and in the legend note below (no crossing ground bus drawn, to keep all wires clean) -->

  <!-- ================= LEGEND ================= -->
  <rect x="80" y="640" width="1340" height="160" rx="10" fill="#fafafa" stroke="#dddddd" stroke-width="1"/>
  <text x="100" y="668" font-size="15" font-weight="700" fill="#111111">Legend / Power &amp; Signal Flow</text>

  <line x1="100" y1="692" x2="140" y2="692" stroke="#c9a53b" stroke-width="2.2" marker-end="url(#arrowGold)"/>
  <text x="150" y="697" font-size="12.5" fill="#333333">Solar input (5V) → TP4056</text>

  <line x1="380" y1="692" x2="420" y2="692" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrowRed)"/>
  <text x="430" y="697" font-size="12.5" fill="#333333">Battery charge / discharge (3.7V)</text>

  <line x1="760" y1="692" x2="800" y2="692" stroke="#3a9142" stroke-width="2.2" marker-end="url(#arrowGreen)"/>
  <text x="810" y="697" font-size="12.5" fill="#333333">Regulated 5V rail (Boost Converter output)</text>

  <line x1="100" y1="726" x2="140" y2="726" stroke="#7d3ac9" stroke-width="2.2" marker-end="url(#arrowPurple)"/>
  <text x="150" y="731" font-size="12.5" fill="#333333">3.3V rail (from ESP32, powers LoRa &amp; MPU6050)</text>

  <line x1="560" y1="726" x2="600" y2="726" stroke="#333333" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="610" y="731" font-size="12.5" fill="#333333">Data bus (SPI / I2C)</text>

  <text x="100" y="762" font-size="12" fill="#555555">Power path: Solar → TP4056 (IN) → Battery (BAT, charge/protect) → TP4056 (OUT) → Boost Converter → 5V rail → ESP32 (VIN).</text>
  <text x="100" y="780" font-size="12" fill="#555555">Signal path: ESP32 3.3V rail powers both LoRa (SPI link) and MPU6050 (I2C link). All modules share a common ground.</text>

</svg>
