<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1428" />
      <stop offset="50%" stop-color="#0d1b38" />
      <stop offset="100%" stop-color="#070e1e" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0a1428" stop-opacity="0" />
    </radialGradient>
  </defs>
  
  <rect width="1200" height="675" fill="url(#bgGrad)" />
  <circle cx="600" cy="337" r="280" fill="url(#glow)" />
  
  <!-- Subtle minimal grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="150" y1="0" x2="150" y2="675" />
    <line x1="300" y1="0" x2="300" y2="675" />
    <line x1="450" y1="0" x2="450" y2="675" />
    <line x1="600" y1="0" x2="600" y2="675" />
    <line x1="750" y1="0" x2="750" y2="675" />
    <line x1="900" y1="0" x2="900" y2="675" />
    <line x1="1050" y1="0" x2="1050" y2="675" />
    
    <line x1="0" y1="135" x2="1200" y2="135" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="405" x2="1200" y2="405" />
    <line x1="0" y1="540" x2="1200" y2="540" />
  </g>
  
  <!-- Minimalist Project Frame Geometry -->
  <rect x="220" y="110" width="760" height="455" rx="16" fill="#0f1f3d" fill-opacity="0.5" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="2" />
  
  <!-- Header bar of mock frame -->
  <line x1="220" y1="170" x2="980" y2="170" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5" />
  <circle cx="260" cy="140" r="6" fill="#38bdf8" fill-opacity="0.8" />
  <circle cx="285" cy="140" r="6" fill="#818cf8" fill-opacity="0.8" />
  <circle cx="310" cy="140" r="6" fill="#ffffff" fill-opacity="0.3" />
  
  <!-- Minimalist Abstract UI elements -->
  <rect x="270" y="210" width="300" height="20" rx="4" fill="#ffffff" fill-opacity="0.85" />
  <rect x="270" y="245" width="200" height="12" rx="3" fill="#ffffff" fill-opacity="0.3" />
  <rect x="270" y="270" width="240" height="12" rx="3" fill="#ffffff" fill-opacity="0.3" />
  
  <!-- Minimal Geometric Centerpiece -->
  <g transform="translate(730, 340)">
    <polygon points="0,-90 78,-45 78,45 0,90 -78,45 -78,-45" fill="none" stroke="url(#cyanGrad)" stroke-width="2.5" />
    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="#38bdf8" fill-opacity="0.08" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="0" cy="0" r="14" fill="#ffffff" />
    <circle cx="0" cy="0" r="28" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4" />
  </g>
  
  <rect x="270" y="340" width="180" height="90" rx="8" fill="#13274f" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1" />
  <rect x="470" y="340" width="180" height="90" rx="8" fill="#13274f" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1" />
  
  <text x="600" y="610" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" letter-spacing="4" font-weight="500">PROJECT ALPHA // PLACEHOLDER</text>
</svg>
