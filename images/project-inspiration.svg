<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <defs>
    <linearGradient id="inspBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070e20" />
      <stop offset="100%" stop-color="#0b1733" />
    </linearGradient>
    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1" />
    </linearGradient>
  </defs>
  
  <rect width="1000" height="500" fill="url(#inspBg)" />
  
  <!-- Subtle minimal circular wave forms representing inspiration & flow -->
  <circle cx="500" cy="250" r="200" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
  <circle cx="500" cy="250" r="150" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1" />
  <circle cx="500" cy="250" r="100" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
  <circle cx="500" cy="250" r="50" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" />
  
  <!-- Wave dynamic path -->
  <path d="M 100 250 Q 250 140, 500 250 T 900 250" fill="none" stroke="url(#glowLine)" stroke-width="3" />
  <path d="M 100 250 Q 300 360, 500 250 T 900 250" fill="none" stroke="#818cf8" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="6 6" />
  
  <!-- Minimalist node points -->
  <circle cx="250" cy="195" r="5" fill="#38bdf8" />
  <circle cx="500" cy="250" r="6" fill="#ffffff" />
  <circle cx="750" cy="195" r="5" fill="#818cf8" />
  <circle cx="350" cy="290" r="4" fill="#38bdf8" fill-opacity="0.6" />
  <circle cx="650" cy="290" r="4" fill="#818cf8" fill-opacity="0.6" />
  
  <text x="500" y="440" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" letter-spacing="3" font-weight="400">INSPIRATION ARCHITECTURE // FORM &amp; FUNCTION</text>
</svg>
