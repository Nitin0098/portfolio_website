<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Concepts - Portfolio</title>
  <link rel="icon" type="image/svg+xml" href="../images/logo.svg">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <!-- Persistent Navigation Bar -->
  <header class="site-header">
    <div class="nav-container">
      <a href="../index.html" class="brand-btn" aria-label="Go to Home / Hero page">
        <img src="../images/logo.svg" alt="Logo" class="site-logo">
        <span>Portfolio</span>
      </a>

      <nav class="nav-buttons">
        <a href="projects.html" class="nav-btn">projects</a>
        <a href="concepts.html" class="nav-btn active">concepts</a>
        <a href="contact.html" class="nav-btn">contact</a>
      </nav>
    </div>
  </header>

  <!-- Main Content Section -->
  <main class="main-content">
    <section class="view-section active-view">
      <div class="section-header">
        <h2 class="section-title">Concepts</h2>
      </div>

      <div class="carousel-wrapper">
        <div id="concepts-cards-track" class="cards-track">
          
          <!-- Concept 01 Card (Placeholder) -->
          <article class="content-card" onclick="window.location.href='concept-placeholder.html'">
            <div class="card-media">
              <img src="../images/concept-placeholder-hero.svg" alt="Concept 01: Cognitive Architecture">
            </div>
            <div class="card-content">
              <h3 class="card-title">Concept 01: Cognitive Architecture</h3>
              <div class="card-cta">
                <span>explore more</span>
                <span>&rarr;</span>
              </div>
            </div>
          </article>

          <!-- Concept 02 Card -->
          <article class="content-card" onclick="window.location.href='concept-placeholder.html'">
            <div class="card-media">
              <img src="../images/concept-2.svg" alt="Concept 02: Waveform Harmonics">
            </div>
            <div class="card-content">
              <h3 class="card-title">Concept 02: Waveform Harmonics</h3>
              <div class="card-cta">
                <span>explore more</span>
                <span>&rarr;</span>
              </div>
            </div>
          </article>

        </div>

        <div class="carousel-controls">
          <div class="carousel-indicators">
            <span class="indicator-dot active"></span>
            <span class="indicator-dot"></span>
          </div>
          <div class="carousel-nav-btns">
            <button class="carousel-arrow" onclick="document.getElementById('concepts-cards-track').scrollBy({left: -480, behavior: 'smooth'})" aria-label="Previous">&larr;</button>
            <button class="carousel-arrow" onclick="document.getElementById('concepts-cards-track').scrollBy({left: 480, behavior: 'smooth'})" aria-label="Next">&rarr;</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Personal Portfolio &bull; Minimalist Design</p>
  </footer>

</body>
</html>
