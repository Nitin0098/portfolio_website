<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Nitin Vishwakarma</title>
  <link rel="icon" type="image/svg+xml" href="../images/logo.svg?v=2">
  <link rel="stylesheet" href="../css/style.css?v=2">
</head>
<body>

  <!-- Persistent Navigation Bar -->
  <header class="site-header">
    <div class="nav-container">
      <a href="../index.html" class="brand-btn" aria-label="Nitin Vishwakarma Home">
        <img src="../images/logo.svg?v=2" alt="Logo" class="site-logo">
        <span>Nitin Vishwakarma</span>
      </a>

      <button class="nav-toggle-btn" aria-label="Toggle navigation menu" aria-expanded="false">
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
      </button>

      <nav class="nav-buttons">
        <a href="../index.html" class="nav-btn">home</a>
        <a href="projects.html" class="nav-btn">projects</a>
        <a href="concepts.html" class="nav-btn">concepts</a>
        <a href="contact.html" class="nav-btn active">contact</a>
      </nav>
    </div>
  </header>

  <!-- Main Content Section -->
  <main class="main-content">
    <div class="detail-view">
      <div class="section-header">
        <h2 class="section-title">Contact</h2>
      </div>

      <div class="detail-contact-section" style="margin-top: 0;">
        <h3 class="contact-section-title">Contact Details</h3>
        <p class="contact-section-subtitle">Send a direct message or share your thoughts below.</p>
        
        <div class="contact-info-strip">
          <div class="contact-info-item">
            <span class="contact-info-label">Direct Email</span>
            <span class="contact-info-value"><a href="mailto:nitinfromindia4@gmail.com" class="contact-email-link">nitinfromindia4@gmail.com</a></span>
          </div>
        </div>

        <form class="thoughts-form" action="https://formsubmit.co/nitinfromindia4@gmail.com" method="POST" onsubmit="handleThoughtsSubmit(event, this)">
          <input type="hidden" name="_subject" value="New Message from Portfolio Website">
          <input type="hidden" name="_captcha" value="false">
          <input type="hidden" name="_template" value="table">

          <div class="form-group">
            <label class="form-label">Your Name</label>
            <input type="text" name="name" required class="form-input" placeholder="Your name">
          </div>
          <div class="form-group">
            <label class="form-label">Your Contact / Email</label>
            <input type="email" name="email" required class="form-input" placeholder="name@example.com">
          </div>
          <div class="form-group">
            <label class="form-label">Write Your Thoughts</label>
            <textarea name="message" required class="form-textarea" placeholder="Write your thoughts here..."></textarea>
          </div>
          <button type="submit" class="form-submit-btn">Send Thoughts &rarr;</button>
          <div class="form-success-banner">Thank you! Your message has been sent to Nitin.</div>
        </form>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <p>Nitin Vishwakarma</p>
  </footer>

  <script src="../js/nav.js?v=3"></script>
</body>
</html>
